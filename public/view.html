<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ফাইল ভিউ এবং ডাউনলোড - QR File Share</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    .view-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      margin-top: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .file-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .file-icon-lg {
      font-size: 48px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .file-meta h2 {
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
      margin-bottom: 6px;
      color: #fff;
    }
    .file-meta p {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .preview-box {
      margin-bottom: 28px;
      text-align: center;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .preview-box img {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 10px;
      object-fit: contain;
    }
    .preview-box video {
      width: 100%;
      max-height: 65vh;
      border-radius: 10px;
      background: #000;
      outline: none;
    }
    .preview-box iframe {
      width: 100%;
      height: 65vh;
      border: none;
      border-radius: 10px;
    }
    .audio-wrapper {
      width: 100%;
      padding: 24px 16px;
      text-align: center;
    }
    .audio-wrapper audio {
      width: 100%;
      margin-top: 12px;
    }
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-download-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      background: var(--gradient);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }
    .btn-download-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(102, 126, 234, 0.45);
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .qr-modal {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 14px;
      text-align: center;
    }
    .qr-modal.active {
      display: block;
    }
    .qr-modal img {
      width: 200px;
      height: 200px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .not-found-card {
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo">
        <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:12px;">
          <span class="logo-icon">📱</span>
          <h1>QR File Share</h1>
        </a>
      </div>
      <p class="subtitle">শেয়ার করা ফাইল দেখুন ও ডাউনলোড করুন</p>
    </header>

    <div id="contentArea"></div>

    <footer class="footer">
      <p>💡 <a href="/" style="color:#667eea;text-decoration:none;font-weight:600;">QR File Share</a> দিয়ে আপনিও যেকোনো ফাইল শেয়ার করতে পারেন!</p>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('url');
    const fileName = params.get('name') || 'Shared_File';
    const fileSize = params.get('size');
    const contentArea = document.getElementById('contentArea');

    function formatBytes(bytes) {
      if (!bytes || isNaN(bytes)) return '';
      const b = parseInt(bytes);
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + ' MB';
      return (b / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function getFileType(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext)) return { type: 'image', icon: '🖼️' };
      if (['mp4', 'webm', 'ogg', 'mov', 'mkv', 'avi'].includes(ext)) return { type: 'video', icon: '🎬' };
      if (['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'].includes(ext)) return { type: 'audio', icon: '🎵' };
      if (['pdf'].includes(ext)) return { type: 'pdf', icon: '📕' };
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return { type: 'archive', icon: '📦' };
      if (['doc', 'docx'].includes(ext)) return { type: 'doc', icon: '📘' };
      if (['xls', 'xlsx'].includes(ext)) return { type: 'sheet', icon: '📊' };
      if (['ppt', 'pptx'].includes(ext)) return { type: 'pres', icon: '📙' };
      if (['txt', 'md', 'json', 'js', 'py', 'html', 'css'].includes(ext)) return { type: 'code', icon: '📝' };
      return { type: 'other', icon: '📄' };
    }

    if (!fileUrl) {
      contentArea.innerHTML = `
        <div class="view-card not-found-card">
          <div style="font-size:64px;margin-bottom:16px;">🔍</div>
          <h2>কোনো ফাইল লিংক পাওয়া যায়নি</h2>
          <p style="color:var(--text-secondary);margin:12px 0 24px;">দয়া করে সঠিক লিংক অথবা QR Code ব্যবহার করুন।</p>
          <a href="/" class="btn-download-main" style="display:inline-flex;">➕ নতুন ফাইল আপলোড করুন</a>
        </div>
      `;
    } else {
      const fileInfo = getFileType(fileName);
      const ext = fileName.split('.').pop().toUpperCase();
      const sizeStr = fileSize ? formatBytes(fileSize) : '';

      let previewHtml = '';
      if (fileInfo.type === 'image') {
        previewHtml = `<img src="${fileUrl}" alt="${fileName}" loading="lazy">`;
      } else if (fileInfo.type === 'video') {
        previewHtml = `
          <video controls playsinline preload="metadata">
            <source src="${fileUrl}">
            আপনার ব্রাউজার ভিডিও প্লে করতে পারছে না।
          </video>
        `;
      } else if (fileInfo.type === 'audio') {
        previewHtml = `
          <div class="audio-wrapper">
            <div style="font-size:54px;margin-bottom:8px;">🎵</div>
            <audio controls>
              <source src="${fileUrl}">
              আপনার ব্রাউজার অডিও প্লে করতে পারছে না।
            </audio>
          </div>
        `;
      } else if (fileInfo.type === 'pdf') {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          previewHtml = `
            <div style="padding:32px 16px;text-align:center;">
              <div style="font-size:64px;margin-bottom:12px;">📕</div>
              <p style="font-size:15px;color:rgba(255,255,255,0.8);margin-bottom:16px;">PDF ফাইল সরাসরি ফোনে দেখতে নিচের বাটনে ক্লিক করুন</p>
              <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="display:inline-flex;padding:12px 24px;background:rgba(102,126,234,0.2);border-color:#667eea;">
                📖 PDF খুলুন (Open in Browser)
              </a>
            </div>
          `;
        } else {
          previewHtml = `<iframe src="${fileUrl}" title="PDF Preview"></iframe>`;
        }
      } else {
        previewHtml = `
          <div style="padding:32px 16px;text-align:center;">
            <div style="font-size:64px;margin-bottom:12px;">${fileInfo.icon}</div>
            <p style="font-size:15px;color:rgba(255,255,255,0.8);">ডাউনলোড করে ফাইলটি আপনার ডিভাইসে ওপেন করুন</p>
          </div>
        `;
      }

      contentArea.innerHTML = `
        <div class="view-card">
          <div class="file-header">
            <div class="file-icon-lg">${fileInfo.icon}</div>
            <div class="file-meta">
              <h2>${fileName}</h2>
              <p>${sizeStr ? sizeStr + ' • ' : ''}${ext} Format</p>
            </div>
          </div>

          <div class="preview-box">
            ${previewHtml}
          </div>

          <div class="action-buttons">
            <a href="${fileUrl}" download="${fileName}" class="btn-download-main" id="directDownloadBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              ফাইল ডাউনলোড করুন (${sizeStr || 'Download'})
            </a>

            <div class="btn-row">
              <button class="btn-secondary" id="copyShareLinkBtn">
                📋 লিংক কপি
              </button>
              <button class="btn-secondary" id="toggleQrBtn">
                📱 QR Code দেখুন
              </button>
              <a href="/" class="btn-secondary">
                ➕ নতুন আপলোড
              </a>
            </div>

            <div class="qr-modal" id="qrModal">
              <div id="qrCanvasContainer"></div>
              <p style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px;">যেকোনো মোবাইল দিয়ে স্ক্যান করে এই পেজটি শেয়ার করুন</p>
            </div>
          </div>
        </div>
      `;

      // Copy link event
      document.getElementById('copyShareLinkBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const btn = document.getElementById('copyShareLinkBtn');
          btn.innerHTML = '✅ কপি হয়েছে!';
          setTimeout(() => { btn.innerHTML = '📋 লিংক কপি'; }, 2000);
        });
      });

      // Toggle QR Code
      const toggleQrBtn = document.getElementById('toggleQrBtn');
      const qrModal = document.getElementById('qrModal');
      let qrGenerated = false;

      toggleQrBtn.addEventListener('click', () => {
        qrModal.classList.toggle('active');
        if (qrModal.classList.contains('active') && !qrGenerated) {
          const container = document.getElementById('qrCanvasContainer');
          const canvas = document.createElement('canvas');
          QRCode.toCanvas(canvas, window.location.href, { width: 200, margin: 2 }, (err) => {
            if (!err) {
              container.appendChild(canvas);
              qrGenerated = true;
            }
          });
        }
      });
    }
  </script>
</body>
</html>
